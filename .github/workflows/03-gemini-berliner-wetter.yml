name: 03 - Gemini KI Berliner Schnauze Wetterbericht

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  berlin-ai-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas google-genai

      - name: Wetterdaten filtern und mit Gemini (Berliner Schnauze) auswerten
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os
          import requests
          import pandas as pd
          from google import genai

          # 1. Open-Meteo Wetterdaten abrufen
          url = 'https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&hourly=temperature_2m'
          response = requests.get(url).json()['hourly']

          df = pd.DataFrame({
              'zeit': pd.to_datetime(response['time']),
              'temp': response['temperature_2m']
          })

          # DATEN FILTERN: Nur Daten ab heute 00:00 Uhr berücksichtigen
          heute_start = pd.Timestamp.now().floor('D')
          df_gefiltert = df[df['zeit'] >= heute_start].reset_index(drop=True)

          avg_temp = df_gefiltert['temp'].mean()
          max_temp = df_gefiltert['temp'].max()
          min_temp = df_gefiltert['temp'].min()

          # 2. Gemini API Client aufsetzen
          api_key = os.environ.get('GEMINI_API_KEY')
          if not api_key:
              raise ValueError('GEMINI_API_KEY Secret fehlt!')
          
          client = genai.Client(api_key=api_key)

          # 3. Prompt mit Anweisung für Berliner Schnauze
          prompt = f'''
          Du bist ein originaler Berliner Wetter-Bot. Gib dem Entwickler-Team (Julian, Marcus, Christian und Andre) einen Wetterbericht.
          
          Wichtige Vorgaben:
          - Sprich durchgehend in authentischer Berliner Schnauze (z.B. 'Wat', 'Dit', 'Keene', 'Wa?', 'Juten Tag', 'Kacke', 'Icke').
          - Sei gewohnt direkt, leicht rotzig, aber herzliche Berliner Art.
          - Geh auf die Teammitglieder Julian, Marcus, Christian und Andre ein.
          
          Wetterdaten für Berlin ab heute:
          - Durchschnittstemperatur: {avg_temp:.1f} °C
          - Höchstwert: {max_temp:.1f} °C
          - Tiefstwert: {min_temp:.1f} °C

          Schreibe einen kurzen Text (ca. 4-5 Sätze) mit konkretem Kleidungs- oder Ansage-Tipp fürs Arbeiten.
          '''

          print('--> Sende Daten an Gemini 2.5 Flash...')
          ai_response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents=prompt,
          )
          
          ki_text = ai_response.text
          print('\n--- GENERIERTER BERLINER TEXT ---')
          print(ki_text)
          print('----------------------------------\n')

          # 4. HTML Dashboard mit Berliner Text rendern
          html_content = f'''<!DOCTYPE html>
          <html lang=\"de\">
          <head>
              <meta charset=\"UTF-8\">
              <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
              <title>Berliner Wetter-Dashboard</title>
              <style>
                  body {{ font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 40px; color: #333; }}
                  .container {{ max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }}
                  h1 {{ color: #1F4E79; margin-top: 0; }}
                  .berlin-box {{ background-color: #FEF3C7; border-left: 5px solid #D97706; padding: 20px; border-radius: 8px; margin: 20px 0; font-size: 1.1em; line-height: 1.6; color: #78350F; }}
                  .berlin-title {{ font-weight: bold; color: #92400E; margin-bottom: 8px; font-size: 1.2em; }}
                  .kpi-group {{ display: flex; gap: 15px; margin-top: 25px; }}
                  .kpi-card {{ flex: 1; background: #F9FAFB; border: 1px solid #E5E7EB; padding: 15px; border-radius: 8px; text-align: center; }}
                  .kpi-title {{ font-size: 0.8em; color: #6B7280; text-transform: uppercase; font-weight: bold; }}
                  .kpi-value {{ font-size: 1.5em; font-weight: bold; color: #111827; margin-top: 5px; }}
                  .footer {{ margin-top: 30px; font-size: 0.85em; color: #9CA3AF; text-align: center; }}
              </style>
          </head>
          <body>
              <div class=\"container\">
                  <h1>🐻 Berliner Wetter-Ansage</h1>
                  <p>Generiert via <strong>GitHub Actions</strong> & <strong>Google Gemini 2.5 Flash</strong></p>
                  
                  <div class=\"berlin-box\">
                      <div class=\"berlin-title\">🗣️ Ansage aus'm Runner:</div>
                      <div>{ki_text.replace(chr(10), '<br>')}</div>
                  </div>

                  <div class=\"kpi-group\">
                      <div class=\"kpi-card\"><div class=\"kpi-title\">Ø Temp (ab heute)</div><div class=\"kpi-value\">{avg_temp:.1f} °C</div></div>
                      <div class=\"kpi-card\"><div class=\"kpi-title\">Max</div><div class=\"kpi-value\">{max_temp:.1f} °C</div></div>
                      <div class=\"kpi-card\"><div class=\"kpi-title\">Min</div><div class=\"kpi-value\">{min_temp:.1f} °C</div></div>
                  </div>

                  <div class=\"footer\">
                      Live Demo für Julian, Marcus, Christian & Andre
                  </div>
              </div>
          </body>
          </html>'''

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(html_content)
          "

      - name: HTML-Dashboard ins Repository committen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Berliner KI-Wetterbericht aktualisiert [skip ci]" && git push)
